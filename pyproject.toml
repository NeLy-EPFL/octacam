[project]
name = "octacam"
version = "0.3.0.dev0"
description = "Preview, record, and save video streams from multiple scientific cameras (Basler, FLIR, and any GenICam USB3-Vision camera)"
readme = "README.md"
# 3.10 is the floor because the FLIR vendor tier's PySpin wheel is cp310-only; a
# rig that wants that tier is pinned to 3.10. The rest of the backend cascade
# (harvesters + a GenTL producer, pycameleon) runs on any modern Python.
requires-python = ">=3.10"
dependencies = [
    # Basler vendor tier (uv-installable, so it lives in core).
    "pypylon>=4.0",
    # Tier-2 GenTL consumer: harvesters drives any camera through an installed
    # GenTL producer; genicam is its node-map runtime.
    "harvesters>=1.4.3",
    "genicam>=1.2",
    # Tier-3 floor: libusb-only USB3-Vision, always present so the cascade has a
    # guaranteed backend on any Python where no vendor SDK / producer is set up.
    "pycameleon>=0.2.11",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2",
    "typer>=0.15",
    "rich>=13.7",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    # uvicorn ships no WebSocket implementation on its own; the preview/
    # telemetry/jog socket (octacam serve) needs one at runtime.
    "websockets>=16.0",
    "imageio-ffmpeg>=0.6.0",
    # The flywheel and twophoton plugins talk to an Arduino over serial. It's a
    # light, pure-Python dep needed by every bundled plugin, so it ships by
    # default rather than as an extra people can forget to install.
    "pyserial>=3.5",
    # Python 3.10 has no stdlib tomllib (the TOML reader); tomli is the drop-in.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Opt-in plugins (octacam.plugins.<name>). pyserial-backed plugins (flywheel,
# twophoton) now get their dep from the main list, so these are documented,
# greppable install markers rather than dependency lists.
flywheel = []
twophoton = []
# FLIR/Teledyne cameras use the Spinnaker SDK's PySpin wheel, which is NOT on
# PyPI (it ships with the SDK installer). This extra is therefore a documented,
# greppable install marker rather than a dependency list: install the Spinnaker
# SDK and `pip install spinnaker_python-*.whl` manually (see the README).
flir = []

[project.scripts]
octacam = "octacam.cli:main"

[dependency-groups]
dev = [
    "av>=12",
    "httpx>=0.28.1",
    "psutil>=5.9",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1.390",
]
# Documentation site (Material for MkDocs). Preview locally with
# `uv run --group docs mkdocs serve`; CI publishes it to GitHub Pages.
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns wrapping; long help strings / log messages are intentional.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter helpers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Query"]

[tool.pyright]
# The library is the type-check surface; tests use stubs/fakes and monkeypatch
# private attributes, which intentionally fight static typing.
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "--cov=src/octacam --cov-report=term-missing"
