[record]
fps = 100.0
duration = 20
duration_unit = "seconds"      # frames | seconds | minutes | hours
trigger_source = "external"    # software | managed | external

directory = "/home/nely/data/MD"
relative_directory = "%y%m%d_/Fly1/001"

save_method = "ffmpeg"         # ffmpeg | raw

[transcode]
ffmpeg_params = "-c:v libx264 -preset veryslow -crf 20 -pix_fmt gray"

[[cameras]]
serial_number = "40012158"
name = "camera_RF"
scale_x = 1
scale_y = 1
rotation_deg = 0
window_x = 0
window_y = 0.25
window_width = 0.5
window_height = 0.25

[[cameras]]
serial_number = "40012160"
name = "camera_RM"
scale_x = 1
scale_y = 1
rotation_deg = 0
window_x = 0
window_y = 0.5
window_width = 0.5
window_height = 0.25

[[cameras]]
serial_number = "40012161"
name = "camera_RH"
scale_x = 1
scale_y = 1
rotation_deg = 0
window_x = 0
window_y = 0.75
window_width = 0.5
window_height = 0.25

[[cameras]]
serial_number = "40002336"
name = "camera_LF"
scale_x = 1
scale_y = 1
rotation_deg = 0
window_x = 0.5
window_y = 0.25
window_width = 0.5
window_height = 0.25

[[cameras]]
serial_number = "40002330"
name = "camera_LM"
scale_x = 1
scale_y = 1
rotation_deg = 0
window_x = 0.5
window_y = 0.5
window_width = 0.5
window_height = 0.25

[[cameras]]
serial_number = "40001976"
name = "camera_LH"
scale_x = 1
scale_y = 1
rotation_deg = 0
window_x = 0.5
window_y = 0.75
window_width = 0.5
window_height = 0.25

[[cameras]]
serial_number = "40002339"
name = "camera_F"
scale_x = 1
scale_y = 1
rotation_deg = 0
window_x = 0
window_y = 0
window_width = 1
window_height = 0.25

[[plugins]]
name = "twophoton"

[plugins.options]
device = "/dev/arduinoCams"

[[visualization]]
name = "grid.mp4"
layout = [
    ["camera_LF", "",          "camera_RF"],
    ["camera_LM", "camera_F",  "camera_RM"],
    ["camera_LH", "",          "camera_RH"],
]

[transfer]
directory = "/mnt/upramdya_data/MD/BallPushing_Imaging"
checksum = true

[transfer.twophoton]
source = "/mnt/windows_share/MD"
match_window_s = 60
settle_s = 300
