# 2× FLIR Grasshopper3 GS3-U3-41C6NIR (2048×2048) — the "2048" cameras.
# Sensor params (2048² ROI, 2 ms exposure, hardware trigger line) persist as
# <serial>.txt (the camera's native GenApi feature-persistence TSV), set from
# the GUI "Save…" dialog. Under backend = "auto" the FLIRs open through the
