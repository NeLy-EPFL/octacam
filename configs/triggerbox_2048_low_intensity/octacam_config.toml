# --- triggerbox trigger + light plugin ---------------------------------------
# fps and duration come from [record] above. The plugin arms the Arduino on
# record start with the camera line(s) and light channel(s) below. One camera
# line (D13 -> all 6 cameras); CCS ch1 (D5) + ch2 (D6) strobe in sync at 20%
# duty; ch3 (D7) is off. A "strobe" channel with duty_mode = "auto" would size
# its on-time to bracket the longest live camera exposure instead.

[[plugins]]
name = "triggerbox"

[plugins.options]
device = "/dev/ttyACM0"   # Arduino Nano ESP32 (triggerbox firmware); a udev symlink is nicer
cameras = [ { pin = "D13", pulse_us = 500 } ]
lights = [
  { channel = 1, mode = "strobe", duty_mode = "manual", duty_percent = 20.0 },
  { channel = 2, mode = "strobe", duty_mode = "manual", duty_percent = 20.0 },
  { channel = 3, mode = "off" },
]
strobe_guard_us = 100
