# triggerbox rig — "2048 low intensity" preset (80 fps, 20% strobe duty).
#
# octacam equivalent of hexaview-control/config/2048_low_intensity.yaml, but
# parameterized by TIMING (fps) + STROBE DUTY CYCLE instead of raw µs windows:
#
#   hexaview:   pre(250)+exposure(2000)+post(250)+lightOff(10000) = 12500 µs period
#   triggerbox: fps = 80        -> 12500 µs frame period
#               duty = 20 %      -> 2500 µs light-on window (covers the 2 ms exposure)
#               exposure = 2000 µs (per-camera, in the .pfs / .txt)
#
# Cameras run in EXTERNAL hardware-trigger mode; the Arduino Nano ESP32 running
# the triggerbox firmware drives the shared trigger line (D13 -> each camera's
# Line1) and strobes the two CCS LED ring lights (CCS ch1/ch2) in sync. The
# triggerbox plugin arms the board with the fps/duration below + the light spec.

backend = "auto"   # cascade: Basler->pypylon, FLIR Grasshopper3->Spinnaker C

[record]
fps = 80.0
duration = 10.0
duration_unit = "seconds"     # frames | seconds | minutes | hours
trigger_source = "external"   # cameras wait for the Arduino's Line1 trigger

directory = "~/octacam/data/omniview"
relative_directory = "%y%m%d/Fly1/001"

save_method = "ffmpeg"        # ffmpeg | raw
ffmpeg_params = "-c:v libx264 -preset ultrafast -crf 18 -pix_fmt gray"
save_transformed = true
save_timestamps = true        # per-frame timestamp CSV (handy to verify 80 fps)

[transcode]
ffmpeg_params = "-c:v libx264 -preset veryslow -crf 20 -pix_fmt gray"

[transfer]
directory = "~/octacam/server/omniview"
checksum = true

# --- Cameras -----------------------------------------------------------------
# 4× Basler acA1920-150um (1920×1200). Sensor params — 2 ms exposure, gain 0,
# hardware trigger on Line1/RisingEdge — are stored in each <serial>.pfs here.

[[cameras]]
serial_number = "40018619"
name = "basler_1"
scale_x = 1.0
scale_y = 1.0
rotation_deg = 0.0
window_x = -1.0
window_y = -1.0
window_width = -1.0
