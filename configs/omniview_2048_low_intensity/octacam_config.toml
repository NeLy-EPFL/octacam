# omniview rig — "2048 low intensity" preset (80 fps, 20% strobe duty).
#
# octacam equivalent of hexaview-control/config/2048_low_intensity.yaml, but
# parameterized by TIMING (fps) + STROBE DUTY CYCLE instead of raw µs windows:
#
#   hexaview: pre(250)+exposure(2000)+post(250)+lightOff(10000) = 12500 µs period
#   omniview: fps = 80        -> 12500 µs frame period
#             duty = 20 %      -> 2500 µs light-on window (covers the 2 ms exposure)
#             exposure = 2000 µs (per-camera, in the .pfs / .json)
#
# Cameras run in EXTERNAL hardware-trigger mode; the Arduino Nano ESP32 running
# the omniview firmware drives the shared trigger line (D13 -> each camera's
# Line1) and strobes the two CCS LED ring lights (CCS ch1/ch2) in sync. The
# omniview plugin arms the board with the fps/duration below + the strobe duty.

backend = "auto"   # cascade: Basler->pypylon, FLIR Grasshopper3->Spinnaker C

[record]
fps = 80.0
duration = 10.0
duration_unit = "seconds"     # frames | seconds | minutes | hours
trigger_source = "external"   # cameras wait for the Arduino's Line1 trigger

directory = "~/octacam/data/omniview"
relative_directory = "%y%m%d/Fly1/001"

save_method = "ffmpeg"        # ffmpeg | raw
ffmpeg_params = "-c:v libx264 -preset ultrafast -crf 18 -pix_fmt gray"
save_transformed = true
save_timestamps = true        # per-frame timestamp CSV (handy to verify 80 fps)

[transcode]
ffmpeg_params = "-c:v libx264 -preset veryslow -crf 20 -pix_fmt gray"

[transfer]
directory = "~/octacam/server/omniview"
checksum = true

# --- Cameras -----------------------------------------------------------------
# 4× Basler acA1920-150um (1920×1200). Sensor params — 2 ms exposure, gain 0,
# hardware trigger on Line1/RisingEdge — are stored in each <serial>.pfs here.

[[cameras]]
serial_number = "40018619"
name = "basler_1"

[[cameras]]
serial_number = "40018631"
name = "basler_2"

[[cameras]]
serial_number = "40018632"
name = "basler_3"

[[cameras]]
serial_number = "40022761"
name = "basler_4"

# 2× FLIR Grasshopper3 GS3-U3-41C6NIR (2048×2048) — the "2048" cameras.
# Sensor params (2048² ROI, 2 ms exposure, hardware trigger line) persist as
# <serial>.json, set from the GUI "Save…" dialog. NOTE: on this branch the
# Spinnaker-C backend currently aborts on teardown (libusb cleanup assertion);
# resolve that before relying on the FLIRs in a headless recording.

[[cameras]]
serial_number = "17475185"
name = "flir_1"

[[cameras]]
serial_number = "17475187"
name = "flir_2"

# --- omniview trigger + strobe plugin ----------------------------------------
# fps and duration come from [record] above; the plugin adds the strobe duty
# cycle (and optional camera-pulse width) and arms the Arduino on record start.

[[plugins]]
name = "omniview"

[plugins.options]
device = "/dev/ttyACM0"   # Arduino Nano ESP32 (omniview firmware); a udev symlink is nicer
duty_percent = 20.0       # LED strobe duty (% of the frame period) -> 2.5 ms on @ 80 fps
# cam_pulse_us = 500      # camera trigger pulse width (0/omit = firmware default)
