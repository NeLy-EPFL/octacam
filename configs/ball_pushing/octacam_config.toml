backend = "auto"

[record]
fps = 80.0
duration = 3600.0
duration_unit = "seconds"
trigger_source = "managed"
preview_trigger_source = "auto"
directory = "~/octacam/data/ball-pushing"
relative_directory = "%y%m%d/001"
save_method = "ffmpeg"
ffmpeg_params = "-c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p"
save_transformed = true
save_timestamps = true

[transcode]
ffmpeg_params = "-c:v libx264 -preset veryslow -crf 18 -pix_fmt yuv420p"

[[cameras]]
serial_number = "17475187"
name = "top"
scale_x = 1.0
scale_y = 1.0
rotation_deg = 0.0
window_x = 0.0
window_y = 0.0
window_width = 1.0
window_height = 1.0
center_x = true
center_y = true

# Closed loop: corridors 1/3/5 are tracked; 2/4/6 are their yoked controls,
# lit by the same LED. Listed first: its log opens before the boards arm.
[[plugins]]
name = "closedloop"
[plugins.options]
camera = "top"
corridors = 6
pairs = [
  { corridor = 1, control = 2, channel = 1 },
  { corridor = 3, control = 4, channel = 2 },
  { corridor = 5, control = 6, channel = 3 },
]
direction = "up"        # away from the start chambers (the flies start at the bottom)
push_px = 10.0
min_on_s = 1.0          # a push lights the pair at least this long, and while the ball moves
refractory_s = 0.0
enabled = true

# Camera trigger + IR illumination (the original board).
[[plugins]]
name = "triggerbox"
[plugins.options]
device = "/dev/serial/by-id/usb-Arduino_Nano_ESP32_744DBDA08F18-if01"
cameras = [{pin = "D13", pulse_us = 500}]
lights = [{channel = 1, mode = "strobe", duty_mode = "manual", duty_percent = 25.0}, {channel = 2, mode = "strobe", duty_mode = "manual", duty_percent = 25.0}, {channel = 3, mode = "off"}]
strobe_guard_us = 100

# Optogenetic LEDs (the new board): channel 1 = corridors 1+2, 2 = 3+4, 3 = 5+6.
[[plugins]]
name = "opto"
[plugins.options]
device = "/dev/serial/by-id/usb-Arduino_Nano_ESP32_E4B063AF3948-if01"
channels = [ { pin = "D7" }, { pin = "D8" }, { pin = "D9" } ]   # steady while on

[transfer]
directory = "/mnt/upramdya/data/DD/ball_pushing_opto"
checksum = true
